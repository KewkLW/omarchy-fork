# Settings for the disk watchdog (omarchy toggle disk-watch) and omarchy disk top.
# Copy to ~/.config/omarchy/disk-watch.conf and edit. One "key = value" per
# line; keys that take a list are repeated. Thresholds live on the service:
# systemctl --user edit omarchy-disk-watch (OMARCHY_DISK_* variables).

# Mount points to watch. Default: /
watch = /

# Where linked git worktrees are looked for, three levels deep. A worktree that
# is merged into its repo's main branch, has nothing uncommitted or untracked,
# no process inside, and is untouched for min_age_days is safe to remove.
# Default: ~/Work ~/build ~/src ~/code
# worktree_root = ~/Work
min_age_days = 1
# A worktree with unmerged or uncommitted work is listed for you to decide
# once it has been idle this long.
ask_idle_days = 14
# Build output inside a worktree that has to stay (target/, node_modules/, ...)
# is safe on its own once no process runs in the worktree and nothing has
# written to it for this many hours. It is rebuilt on the next build.
build_idle_hours = 6

# Caches safe to delete once untouched for N days: "<glob> [days]" (default 2).
# cache = ~/.cache/my-build-scratch-* 3

# Large directories listed for you to decide once untouched for N days
# (default 30), such as games and Wine prefixes. Never removed on their own.
large = ~/.local/share/Steam/steamapps/common/* 30
large = ~/Games/* 30

# Never removed or listed as removable.
# protect = ~/Work/important-thing
